# Vaultora nginx configuration
# SPA fallback + security headers for password manager

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------
    # SPA Fallback: route all non-file requests to index.html
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # Security Headers (critical for password manager)
    # ------------------------------------------------------------
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # XSS protection (legacy but harmless)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy: no referrer on cross-origin
    add_header Referrer-Policy "no-referrer" always;

    # Permissions Policy: restrict powerful browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Content Security Policy: strict for zero-knowledge app
    # - default-src 'self': only same-origin
    # - script-src 'self': no inline scripts, no eval (Vite builds don't need it)
    # - style-src 'self' 'unsafe-inline': Tailwind injects styles inline
    # - font-src 'self' data: https://fonts.gstatic.com: Google Fonts (optional)
    # - connect-src 'self': no external API calls (offline-first)
    # - img-src 'self' data:: inline images, same-origin
    # - manifest-src 'self': PWA manifest
    # - worker-src 'self' blob:: Service Worker
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self' data: https://fonts.gstatic.com;
        connect-src 'self';
        img-src 'self' data:;
        manifest-src 'self';
        worker-src 'self' blob:;
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
    " always;

    # ------------------------------------------------------------
    # Cache static assets aggressively (hashed filenames)
    # ------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------
    # Service Worker: no cache, must revalidate
    # ------------------------------------------------------------
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ------------------------------------------------------------
    # Manifest: cache briefly
    # ------------------------------------------------------------
    location /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        font/woff
        font/woff2
        image/svg+xml;

    # ------------------------------------------------------------
    # Hide nginx version
    # ------------------------------------------------------------
    server_tokens off;
}