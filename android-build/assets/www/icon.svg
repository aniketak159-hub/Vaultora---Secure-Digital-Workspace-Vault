<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Squircle Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Shield Shape -->
  <path d="M 256,96 L 396,156 C 396,280 340,364 256,416 C 172,364 116,280 116,156 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Shield Contrast Shadow -->
  <path d="M 256,120 L 372,170 C 372,274 326,346 256,390 C 186,346 140,274 140,170 Z" 
        fill="#0f172a" 
        fill-opacity="0.45"/>

  <!-- Padlock Shackle -->
  <path d="M 216,240 L 216,196 C 216,173.9 233.9,156 256,156 C 278.1,156 296,173.9 296,196 L 296,240" 
        fill="none" 
        stroke="url(#lockGrad)" 
        stroke-width="24" 
        stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="186" y="232" width="140" height="116" rx="28" fill="url(#lockGrad)"/>

  <!-- Keyhole -->
  <circle cx="256" cy="280" r="14" fill="#1e1b4b"/>
  <polygon points="251,280 261,280 264,312 248,312" fill="#1e1b4b"/>
</svg>
